<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>memories</title>
  <style>
  body {
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    font-family: "Segoe UI", Arial, sans-serif;
    text-align: center;
    padding: 30px;
  }

  #heading {
    font-size: 32px;
    color: #b30059;
    margin-bottom: 30px;
  }

  .gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* desktop */
  gap: 30px;
  max-width: 900px;
  margin: auto;
}

  .photo {
  width: 100%;
  aspect-ratio: 3 / 4;   /* keeps photos proportional */
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 12px 25px rgba(0,0,0,0.25);
  transition: transform 0.3s ease;
}

  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;     /* MAGIC LINE ✨ */
  }

  .photo:hover {
    transform: scale(1.07);
  }

  .note {
    margin-top: 35px;
    font-size: 20px;
    color: #4a0033;
  }
  /* Tablets */
@media (max-width: 900px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
}

/* Mobile phones */
@media (max-width: 600px) {
  body {
    padding: 15px;
  }

  #heading {
    font-size: 26px;
  }

  .gallery {
    grid-template-columns: 1fr; /* 1 photo per row */
    gap: 18px;
  }

  .photo {
    border-radius: 14px;
  }

  .note {
    font-size: 18px;
  }
}
</style>

</head>
<body>
  <h2 id="heading">Happy Valentine’s Day</h2>
  <div class="gallery">
    <div class="photo">
      <img src="photo1.jpeg" alt="memory 1">
    </div>
    <div class="photo">
      <img src="photo2.jpeg" alt="memory 2">
    </div>
    <div class="photo">
      <img src="photo3.jpeg" alt="memory 3">
    </div>
    <div class="photo">
      <img src="photo4.jpeg" alt="memory 4">
    </div>
    <div class="photo">
      <img src="photo5.jpeg" alt="memory 5">
    </div>
    <div class="photo">
      <img src="photo6.jpeg" alt="memory 6">
    </div>
    <div class="photo">
      <img src="photo7.jpeg" alt="memory 7">
    </div>
    <div class="photo">
      <img src="photo8.jpeg" alt="memory 8">
    </div>
    <div class="photo">
      <img src="photo9.jpeg" alt="memory 9">
    </div>
  </div>
   <div class="note">
    Forever grateful for you 💞
  </div>
</body>
</html>
