<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shilli golli</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
    }

    img {
      width: 250px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 34px;
      color: #b30047;
      margin-bottom: 15px;
    }

    #messege {
      font-size: 20px;
      color: #5a0f2e;
      margin-bottom: 25px;
      min-height: 28px;
    }

    #buttons {
      display: flex;
      gap: 20px;
    }

    button {
      padding: 12px 30px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 8px 15px rgba(255, 77, 109, 0.4);
    }

    #yes:hover {
      background-color: #e6004c;
      transform: scale(1.08);
    }

    #no {
      background-color: #6c757d;
      color: white;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.25);
    }

    #no:hover {
      background-color: #495057;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <img id="mainImg"  src="https://media.tenor.com/p_VEcmrBsLMAAAAi/manja.gif" alt="A beautiful scenery">
  <h1 id="question">Will you be my Valentine??💖</h1>
  <div id="buttons">
    <button id="yes" onclick="yesClicked()">Yes</button>
    <button id="no" onclick="noClicked()">No</button>
  </div>
  <script>
    let noCount=0;
    let count=0;
    function noClicked(){
      noCount++;

      if(noCount==1){
        document.getElementById("question").innerText="sochoo!! Think again shilpa😏";
        document.getElementById("mainImg").src =
    "https://media.tenor.com/sCeOHLbcBcUAAAAi/love.gif";
      } 
      else if(noCount==2){
        document.getElementById("question").innerText="Now you have only one choice shilli😌";
        document.getElementById("no").style.display="none";
      }
    }
    function yesClicked(){
      count++;
      if(count==1){
        document.getElementById("question").innerText="Will you agree in one short??"
      }
      else if(count==2){
        window.location.href="second.html";
      }
    }
  </script>
</body>
</html>
